<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    pre { white-space: pre-wrap; }
    .notice { padding: .5rem .75rem; border-left: 4px solid #c60; background: #fff4e5; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <div id="result" aria-live="polite"></div>
  <script type="module">
    const form = document.querySelector("form");
    const input = document.querySelector("#message");
    const button = form.querySelector("button");
    const result = document.querySelector("#result");
    const topicNames = { delivery: "Доставка", pricing: "Цены", other: "Другое" };
    const MANUAL_TEXT = "AI не смог разобрать заявку. Разберите её вручную: автоматического черновика нет.";

    function clear() {
      result.replaceChildren();
    }

    function notice(message) {
      clear();
      const p = document.createElement("p");
      p.className = "notice";
      p.textContent = message;
      result.append(p);
    }

    function show(topic, draft) {
      clear();
      const h = document.createElement("h2");
      h.textContent = "Тема: " + (topicNames[topic] ?? topic);
      const pre = document.createElement("pre");
      pre.textContent = draft;
      result.append(h, pre);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      // Предыдущий черновик не должен оставаться на экране ни при каком исходе.
      clear();
      if (!input.value.trim()) {
        notice("Введите текст заявки.");
        return;
      }
      button.disabled = true;
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: input.value }),
        });
        const data = await reply.json();
        if (reply.status === 400 || data.status === "invalid_input") {
          notice("Введите текст заявки.");
        } else if (reply.ok && data.status === "ready") {
          show(data.topic, data.draft);
        } else {
          notice(MANUAL_TEXT);
        }
      } catch {
        notice(MANUAL_TEXT);
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
